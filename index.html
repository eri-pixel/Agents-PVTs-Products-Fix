   <div class="tiles">${DATA.progs.map((p,i)=>`<button class="tile" style="background:var(${COLORS[i]})" data-a="open" data-i="${i}"><span class="st">${status(i)}</span><span>${esc(p.name)}</span></button>`).join("")}</div>
   ${done&&next>=0?`<div class="row" style="justify-content:center;margin-top:18px"><button class="btn small" data-a="excel">Download Excel of answers so far</button></div>`:""}`;
}
function header(){const p=DATA.progs[cur.i];const at=cur.step==="xero"?0:cur.step==="done"?PAGES.length+1:cur.step+1;
  return `<div class="top"><button class="btn small" data-a="home">← All programs</button><span class="chip">${cur.i+1} of 9 · ${esc(p.name)}</span></div>
  <div class="steps">${Array.from({length:PAGES.length+1},(_,k)=>`<span class="${k<=at?"on":""}"></span>`).join("")}</div>`}
let multi=false,pickSet=[];
function xeroPage(){const p=DATA.progs[cur.i],s=prog(cur.i);const L=multi?pickSet:xs(cur.i);
  return `${header()}<div class="card"><div class="eyebrow">Step 1</div><h2>Which Xero product${multi?"s are":" is"} ${esc(p.name)}?</h2>
   <p class="muted small">We'll use the details to start you off.</p>
   <label class="row small" style="margin:10px 0;cursor:pointer;font-weight:600"><input type="checkbox" id="multi" style="width:auto" ${multi?"checked":""}> This program uses more than one Xero product</label>
   <div class="pick">${p.cands.map(id=>{const x=DATA.xero[id];const on=L.includes(id);return `<button class="btn ${on?"sel":""}" data-a="xero" data-v="${id}"><span>${multi?(on?"☑ ":"☐ "):""}<b>${esc(x[0])}</b><br><span class="small muted">${esc(x[1])}</span></span></button>`}).join("")}
   ${multi?"":`<button class="btn ${s.xero===null&&!s.xs?.length?"sel":""}" data-a="xero" data-v=""><span><b>None of these</b><br><span class="small muted">Start with empty details</span></span></button>`}</div>
   ${multi?`<div class="foot"><span class="small muted" style="align-self:center">${pickSet.length} selected</span><button class="btn primary" data-a="xmulti" ${pickSet.length?"":"disabled"}>Next →</button></div>`:""}
   ${comment("x")}</div>`}
function page(){const [title,cols]=PAGES[cur.step];const left=cols.filter(c=>!filled(cur.i,c)).length;
  const note=title==="Delivery"&&cur.i>0?`<div class="fv small" style="margin-bottom:6px">If a delivery detail is the same as the previous program, just tap <b>Same as ${esc(DATA.progs[prevIdx()]?.name||"previous")}</b>.${prevIdx()>=0?` <button class="btn small" data-a="sameall">Use all from ${esc(DATA.progs[prevIdx()].name)}</button>`:""}</div>`:"";
  return `${header()}<div class="card"><div class="eyebrow">Step ${cur.step+2} of ${PAGES.length+1}</div><h2>${title}</h2>
   ${note}${cols.map(field).join("")}${comment(cur.step)}
   <div class="foot"><button class="btn" data-a="back">← Back</button><span class="small muted" style="align-self:center">${left?`${left} left on this page`:"All done ✓"}</span><button class="btn primary" data-a="next" ${left?"disabled":""}>${cur.step===PAGES.length-1?"Finish this program ✓":"Next →"}</button></div></div>`}
function comment(k){const v=prog(cur.i).com?.[k]||"";return `<div class="f" style="margin-top:14px;border-top:1px dashed var(--line)"><div class="fl">💬 Comments <span class="small muted" style="font-weight:500">(optional)</span></div>
  <textarea id="com" placeholder="Please put a comment if I forgot to add something">${esc(v)}</textarea><div><button class="btn small" data-a="savecom" data-k="${k}">${v?"Update comment":"Save comment"}</button></div></div>`}
function prevIdx(){for(let k=cur.i-1;k>=0;k--){if(prog(k).f)return k}return -1}
function field(c){
  const spec=F[c],a=ans(cur.i,c),done=filled(cur.i,c),w=wb(cur.i,c);
  const head=`<div class="row" style="justify-content:space-between"><span class="fl">${esc(LABEL[c]||H[c])}</span>${done?`<span class="tag ok">Done</span>`:`<span class="tag chg">Needed</span>`}</div>`;
  let body="";
  if(spec.t==="confirm"){
    if(editing===c)body=`${spec.long?`<textarea id="ed">${esc(a?.v??(isTbc(w)?"":w))}</textarea>`:`<input id="ed" value="${esc(a?.v??(isTbc(w)?"":w))}">`}<div class="row"><button class="btn primary small" data-a="saveed" data-c="${c}">Save</button><button class="btn small" data-a="canced">Cancel</button></div>`;
    else{const v=a?.v??w;body=`<div class="fv ${isTbc(v)?"tbc":""}">${isTbc(v)?"Not filled in yet":esc(v)}</div><div class="row">${isTbc(v)?"":`<button class="btn ok small ${a?"on":""}" data-a="ok" data-c="${c}">✓ Correct</button>`}<button class="btn small" data-a="edit" data-c="${c}">${isTbc(v)?"Fill in":"Change"}</button></div>`}
  }
  if(spec.t==="single"||spec.t==="multi"){
    const have=a?.v?String(a.v).split(/\s*,\s*/):[];const extra=have.filter(x=>!spec.o.includes(x)).join(", ");
    body=`<div class="choices">${spec.o.map(o=>`<button class="btn ${have.includes(o)?"sel":""}" data-a="${spec.t}" data-c="${c}" data-v="${esc(o)}">${spec.t==="multi"?(have.includes(o)?"☑ ":"☐ "):""}${esc(o)}</button>`).join("")}</div>
     ${spec.other?`<div class="row" style="flex-wrap:nowrap"><input id="oth-${c}" placeholder="${spec.lbl||"Something else? Type it here"}" value="${esc(extra)}"><button class="btn small" data-a="oth" data-c="${c}">Add</button></div>`:""}
     ${spec.t==="multi"?`<div class="small muted">Pick as many as apply.</div>`:""}${!done&&w&&!isTbc(w)&&!spec.o.includes(w)?`<div class="small muted">Xero says: ${esc(w)}</div>`:""}`;
  }
  if(spec.t==="suggest"){
    const s=SUG[DATA.progs[cur.i].name]?.[c]||[];const v=a?.v||"";const own=v&&!s.includes(v);
    body=`<div class="pick">${s.map((x,k)=>`<button class="btn ${v===x?"sel":""}" data-a="sug" data-c="${c}" data-k="${k}"><span><b class="small" style="color:var(--accent)">Option ${k+1}${v===x?" ✓":""}</b><br>${esc(x)}</span></button>`).join("")}
     ${editing===c?`<textarea id="ed">${esc(own?v:"")}</textarea><div class="row"><button class="btn primary small" data-a="saveown" data-c="${c}">Save my version</button><button class="btn small" data-a="canced">Cancel</button></div>`
      :own?`<div class="btn sel" style="cursor:default;text-align:left"><b class="small" style="color:var(--accent)">Your version ✓</b><br>${esc(v)}</div><div><button class="btn small" data-a="edit" data-c="${c}">Edit my version</button></div>`
      :`<button class="btn" data-a="edit" data-c="${c}"><span><b>✨ Ooh, I've got my own idea!</b><br><span class="small muted">Write it your way</span></span></button>`}</div>`;
  }
  if(spec.t==="text"){
    const p=prevIdx();const pv=spec.same&&p>=0?ans(p,c)?.v:"";
    if(editing===c||!a)body=`<textarea id="ed-${c}" placeholder="Type here">${esc(a?.v??(isTbc(w)?"":w))}</textarea><div class="row"><button class="btn primary small" data-a="savetxt" data-c="${c}">Save</button>${(spec.quick||[]).map(q=>`<button class="btn small" data-a="quick" data-c="${c}" data-v="${esc(q)}">${esc(q)}</button>`).join("")}${pv?`<button class="btn small" data-a="same" data-c="${c}">Same as ${esc(DATA.progs[p].name)}</button>`:""}${a?`<button class="btn small" data-a="canced">Cancel</button>`:""}</div>${pv?`<div class="small muted">${esc(DATA.progs[p].name)}: ${esc(pv)}</div>`:""}`;
    else body=`<div class="fv">${esc(a.v)}</div><div><button class="btn small" data-a="edit" data-c="${c}">Change</button></div>`;
  }
  if(spec.t==="price"){const t=a?.t||{};
    const tier2=(k,lbl,def)=>{const v=t[k];const ed=editing==="p"+k||(!v&&!def);
      return `<div class="prow"><b>${lbl}</b>${ed?`<span class="row" style="flex-wrap:nowrap;gap:6px"><span>$</span><input id="pr-${k}" inputmode="decimal" placeholder="0" style="width:90px;padding:6px 8px" value="${esc((v||"").replace(/^\$/,"").replace("Not offered",""))}"><button class="btn primary small" data-a="prsave" data-k="${k}">Save</button><button class="btn small" data-a="prnone" data-k="${k}">Not offered</button></span>`
       :v?`<span class="row" style="gap:6px"><span class="tag ok">${esc(v)}</span><button class="btn small" data-a="predit" data-k="${k}">Change</button></span>`
       :`<span class="row" style="gap:6px"><b>${def}</b><button class="btn ok small" data-a="prok" data-k="${k}" data-v="${def}">✓</button><button class="btn small" data-a="predit" data-k="${k}">Change</button></span>`}</div>`};
    body=`<div class="pgrid"><div><div class="eyebrow" style="color:var(--agent)">Agents</div>${tier2("a","1.5 hrs","$475")}${tier2("b","2 hrs","")}${tier2("c","3 hrs","")}</div>
      <div><div class="eyebrow" style="color:var(--pvt)">PVT</div>${tier2("d","1.5 hrs","$525")}${tier2("e","2 hrs","")}${tier2("f","3 hrs","")}</div></div>`;
  }
  if(false){
    const tier=(k,lbl,def)=>`<div class="f" style="padding:8px 0"><div class="row" style="justify-content:space-between"><b>${lbl}</b>${t[k]?`<span class="tag ok">${esc(t[k])}</span>`:""}</div>
      ${editing==="p"+k||(!t[k]&&!def)?`<div class="row" style="flex-wrap:nowrap"><span style="font:800 1.2rem var(--display)">$</span><input id="pr-${k}" inputmode="decimal" placeholder="Agent price" value="${esc((t[k]||"").replace(/^\$/,"").replace("Not offered",""))}"><button class="btn primary small" data-a="prsave" data-k="${k}">Save</button></div><div class="row"><button class="btn small" data-a="prnone" data-k="${k}">Not offered</button></div>`
      :t[k]?`<div><button class="btn small" data-a="predit" data-k="${k}">Change</button></div>`
      :`<div class="fv">${def}</div><div class="row"><button class="btn ok small" data-a="prok" data-k="${k}" data-v="${def}">✓ Correct</button><button class="btn small" data-a="predit" data-k="${k}">Change</button></div>`}</div>`;
    body=`<div class="small muted">Agents only. This is different from PVT pricing.</div>${tier("a","1.5 hours","$475")}${tier("b","2 hours","")}${tier("c","3 hours","")}`;
  }
  return `<div class="f">${head}${body}</div>`;
}
function donePage(){const p=DATA.progs[cur.i];const next=DATA.progs.findIndex((q,i)=>!prog(i).done);setTimeout(confetti,60);
  return `${header()}<div class="card" style="text-align:center;display:grid;gap:10px;justify-items:center"><div class="eyebrow">Program done</div><h2>${esc(p.name)} ✓</h2>
   <p class="muted" style="margin:0">All details filled in. Thank you!</p>
   <div class="row" style="justify-content:center"><button class="btn" data-a="back">← Back</button>${next>=0?`<button class="btn primary big" data-a="open" data-i="${next}">Next: ${esc(DATA.progs[next].name)} ▶</button>`:`<button class="btn primary big" data-a="excel">Download Excel</button>`}<button class="btn" data-a="home">All programs</button></div></div>`}

let busy=false;
document.addEventListener("click",async e=>{
  const t=e.target.closest("[data-a]");if(!t||t.disabled||busy)return;const a=t.dataset.a,c=+t.dataset.c;busy=true;
  try{await act(a,t,c)}finally{busy=false}
});
async function act(a,t,c){
  const keep=window.scrollY;const done=()=>{render();window.scrollTo(0,keep)};const top=()=>{render();window.scrollTo(0,0)};
  if(a==="home"){cur=null;editing=null;return top()}
  if(a==="open"){const i=+t.dataset.i;cur={i,step:prog(i).xero===undefined?"xero":0};editing=null;pickSet=xs(i).slice();multi=pickSet.length>1;return top()}
  if(a==="xero"){const v=t.dataset.v||null;if(multi){pickSet=pickSet.includes(v)?pickSet.filter(x=>x!==v):[...pickSet,v];return done()}
    const same=xs(cur.i).length===(v?1:0)&&(v?xs(cur.i)[0]===v:prog(cur.i).xero===null);if(!same)await save(cur.i,{xero:v,xs:v?[v]:[],f:{}});cur.step=0;return top()}
  if(a==="xmulti"){const old=xs(cur.i).join();if(old!==pickSet.join())await save(cur.i,{xero:pickSet[0],xs:pickSet,f:{}});cur.step=0;return top()}
  if(a==="savecom"){const v=document.getElementById("com").value.trim();await save(cur.i,{com:{...(prog(cur.i).com||{}),[t.dataset.k]:v}});toast(v?"Comment saved":"Comment cleared");return done()}
  if(a==="ok"){await setAns(c,{v:wb(cur.i,c)});return done()}
  if(a==="edit"){editing=c;done();setTimeout(()=>document.getElementById("ed")?.focus(),0);return}
  if(a==="canced"){editing=null;return done()}
  if(a==="saveed"||a==="saveown"){const v=document.getElementById("ed").value.trim();if(!v)return toast("Type an answer, or press Cancel");editing=null;await setAns(c,{v});return done()}
  if(a==="single"){await setAns(c,{v:t.dataset.v});return done()}
  if(a==="multi"){const cur0=ans(cur.i,c)?.v;let have=cur0?cur0.split(/\s*,\s*/):[];const v=t.dataset.v;have=have.includes(v)?have.filter(x=>x!==v):[...have,v];await setAns(c,{v:have.join(", ")});return done()}
  if(a==="oth"){const v=document.getElementById("oth-"+c).value.trim();if(!v)return toast("Type something first");const spec=F[c];
    if(spec.t==="single"){await setAns(c,{v})}else{const have=(ans(cur.i,c)?.v||"").split(/\s*,\s*/).filter(x=>x&&spec.o.includes(x));await setAns(c,{v:[...have,v].join(", ")})}return done()}
  if(a==="sug"){await setAns(c,{v:SUG[DATA.progs[cur.i].name][c][+t.dataset.k]});editing=null;return done()}
  if(a==="savetxt"){const v=document.getElementById("ed-"+c).value.trim();if(!v)return toast("Type an answer, or tap a quick option");editing=null;await setAns(c,{v});return done()}
  if(a==="quick"){editing=null;await setAns(c,{v:t.dataset.v});return done()}
  if(a==="same"){editing=null;await setAns(c,{v:ans(prevIdx(),c).v,same:1});return done()}
  if(a==="sameall"){const p=prevIdx();const f={...(prog(cur.i).f||{})};PAGES[4][1].forEach(k=>{const pv=ans(p,k);if(pv&&!f["c"+k])f["c"+k]={v:pv.v,same:1,was:wb(cur.i,k),by:"Amanda",at:today()}});editing=null;await save(cur.i,{f});toast("Copied from "+DATA.progs[p].name+". Check anything that's different.");return done()}
  if(a.startsWith("pr")){const k=t.dataset.k;const tt={...(ans(cur.i,21)?.t||{})};
    if(a==="predit"){editing="p"+k;return done()}
    if(a==="prok")tt[k]=t.dataset.v;
    if(a==="prnone")tt[k]="Not offered";
    if(a==="prsave"){let v=document.getElementById("pr-"+k).value.trim().replace(/^\$/,"");if(!/^\d+(\.\d{1,2})?$/.test(v))return toast("Enter a number, e.g. 550");tt[k]="$"+v}
    editing=null;await setAns(21,{t:tt,v:`1.5hrs ${tt.d||"?"} · 2hrs ${tt.e||"?"} · 3hrs ${tt.f||"?"}`,agent:`1.5hrs ${tt.a||"?"} · 2hrs ${tt.b||"?"} · 3hrs ${tt.c||"?"}`});return done()}
  if(a==="back"){editing=null;pickSet=xs(cur.i).slice();multi=pickSet.length>1;if(cur.step==="done")cur.step=PAGES.length-1;else if(cur.step===0)cur.step="xero";else if(cur.step!=="xero")cur.step--;return top()}
  if(a==="next"){if(!pageDone(cur.i,cur.step))return toast("Please finish every item on this page first");editing=null;
    if(cur.step===PAGES.length-1){const f={...(prog(cur.i).f||{})};f.c44={v:today(),by:"auto",at:today()};await save(cur.i,{done:true,f});cur.step="done"}else cur.step++;return top()}
  if(a==="excel")excel();
}
function excel(){
  if(typeof XLSX==="undefined"){toast("Download isn't available. Refresh and try again.");return}
  const rows=[H.slice()];
  DATA.progs.forEach((p,i)=>rows.push(rowFor(i)));
  const log=[["Program","Field","Workbook value","Amanda's answer","Date"]];
  DATA.progs.forEach((p,i)=>Object.entries(prog(i).f||{}).forEach(([k,x])=>{if(k!=="c44")log.push([p.name,H[+k.slice(1)],x.was||"",x.v,x.at])}));
  const cm=[["Program","Page","Comment"]];const PN={x:"Step 1 · Xero product"};PAGES.forEach((p,k)=>PN[k]=p[0]);
  DATA.progs.forEach((p,i)=>Object.entries(prog(i).com||{}).forEach(([k,v])=>{if(v)cm.push([p.name,PN[k]||k,v])}));
  const b=XLSX.utils.book_new();XLSX.utils.book_append_sheet(b,XLSX.utils.aoa_to_sheet(cm),"Comments");XLSX.utils.book_append_sheet(b,XLSX.utils.aoa_to_sheet(rows),"School Holidays (Agents)");XLSX.utils.book_append_sheet(b,XLSX.utils.aoa_to_sheet(log),"Amanda's Answers");
  XLSX.writeFile(b,`Agents and PVTs School Holidays ${today()}.xlsx`);toast("Downloaded");
}
function confetti(){if(matchMedia("(prefers-reduced-motion: reduce)").matches||document.getElementById("confetti"))return;const c=document.createElement("canvas");c.id="confetti";document.body.appendChild(c);const x=c.getContext("2d");c.width=innerWidth;c.height=innerHeight;
  const cs=getComputedStyle(document.documentElement);const cols=COLORS.map(v=>cs.getPropertyValue(v).trim());
  const ps=Array.from({length:120},()=>({x:c.width/2,y:c.height/3,vx:(Math.random()-.5)*13,vy:-Math.random()*11-3,r:Math.random()*6+3,c:cols[Math.floor(Math.random()*9)],a:Math.random()*6}));
  let t=0;(function f(){x.clearRect(0,0,c.width,c.height);ps.forEach(p=>{p.vy+=.33;p.x+=p.vx;p.y+=p.vy;p.a+=.2;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);x.restore()});if(++t<140)requestAnimationFrame(f);else c.remove()})()}
boot();

</script>
